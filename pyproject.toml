[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sas2pyspark"
version = "0.1.0"
description = "SAS to PySpark translation framework using Tree-sitter"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Author", email = "author@example.com"}
]
keywords = ["sas", "pyspark", "translation", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.2",
    "pyspark>=3.5.0",
    "databricks-sdk>=0.30.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.10.0",
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.1.13",
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12.20240106",
]

[project.urls]
Repository = "https://github.com/username/sas2pyspark"
Documentation = "https://sas2pyspark.readthedocs.io"

[tool.black]
line-length = 100
target-version = ['py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=translator --cov-report=term-missing"

[tool.coverage.run]
source = ["translator"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.hatch.build.targets.wheel]
packages = ["translator"]
